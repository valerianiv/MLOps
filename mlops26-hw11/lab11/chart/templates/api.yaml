apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  MODEL_VERSION: {{ .Values.modelVersion | quote }}
  WARMUP_SECONDS: {{ .Values.warmup | quote }}
  BROKEN_PROBES: {{ .Values.brokenProbes | quote }}
  NEVER_READY: {{ .Values.neverReady | quote }}
  CONCURRENCY: {{ .Values.concurrency | quote }}
  MAX_QUEUE: {{ .Values.maxQueue | quote }}
  QUEUE_TIMEOUT: {{ .Values.queueTimeout | quote }}
  CACHE_SIZE: {{ .Values.cacheSize | quote }}
  HIT_ITERATIONS: {{ .Values.hitIterations | quote }}
  MISS_ITERATIONS: {{ .Values.missIterations | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 4
  minReadySeconds: 3
  progressDeadlineSeconds: 240
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
      annotations:
        configuration: {{ toJson .Values | sha256sum | quote }}
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: api-config}}]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              httpGet: {path: /drain, port: http}
          startupProbe:
            httpGet: {path: /startup, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: http}]
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata: {name: api-sticky}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: http}]
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: {timeoutSeconds: 10800}
{{- if .Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.hpa.cpu }}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Pods, value: 1, periodSeconds: 15}]
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.hpa.stabilization }}
      policies: [{type: Pods, value: 1, periodSeconds: 15}]
{{- end }}
